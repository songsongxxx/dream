<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dream</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dreamstyle.css">
    <!-- Speed: preconnect/dns-prefetch -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://drive.usercontent.google.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js" defer></script>

    <link rel="icon" href="data:,">
</head>

<body>
    <!-- Global loading overlay -->
    <div id="globalLoading" aria-live="polite" role="status">
        <div class="gl-box">
            <div class="gl-spinner" aria-hidden="true"></div>
            <div class="gl-text">Loading…</div>
        </div>
    </div>

    <!-- 🌟 导航栏 -->
    <div class="navbar"></div>


    <!-- 📝 控件 (centered UI) -->
    <div id="voiceControls" class="voice-controls">
        <div class="vc-row">
            <label class="vc-label">Pitch (semitones):</label>
            <input id="uiPitch" type="range" min="-12" max="12" step="1" value="0" style="flex:1">
            <span id="uiPitchVal">0</span>
        </div>
        <div class="vc-row">
            <label class="vc-label">Dream</label>
            <input id="uiRobot" type="checkbox">
            <label class="vc-label">Echo Waves</label>
            <input id="uiChorus" type="checkbox">
            <label class="vc-label">Ethereal Space</label>
            <input id="uiReverb" type="checkbox">
        </div>
    </div>

    <div class="ui-center">
      <div id="controls">
          <input type="text" id="bubbleText" placeholder="Enter text for bubble">
          <button id="generateBubble">Generate Bubble</button>
          <button id="recStart">Start Rec</button>
          <button id="recStop" disabled>Stop Rec</button>
          <button id="testMic">Test Mic</button>
          <audio id="micMonitor" controls></audio>
          <div id="statusMsg" aria-live="polite"></div>
      </div>
    </div>

    <div id="bubbleContainer"></div>

    <script defer src="./dreamscript.js"></script>
</body>

</html>
