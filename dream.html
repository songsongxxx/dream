<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dream</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dreamstyle.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <link rel="icon" href="data:,">
</head>

<body>
    <!-- 🌟 导航栏 -->
    <div class="navbar"></div>

    <!-- 📝 交互控件 -->
    <div id="controls">
        <input type="text" id="bubbleText" placeholder="Dream input">
        <button id="bubbleBtn">Generate Bubble</button>
    </div>

    <div id="bubbleContainer"></div>

    <script>
        const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL"; // 替换为你的 Google Apps Script 部署 URL

        // 保存用户输入到 Google Sheets
        async function saveTextToGoogleSheets(text) {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ text }),
                });
                if (response.ok) {
                    console.log("✅ 数据已成功存储到 Google Sheets");
                } else {
                    console.error("❌ 存储失败", response.statusText);
                }
            } catch (error) {
                console.error("❌ 请求失败", error);
            }
        }

        // 从 Google Sheets 加载数据
        async function loadTextFromGoogleSheets() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                const container = document.getElementById("bubbleContainer");
                container.innerHTML = "";

                data.forEach(({ text, timestamp }) => {
                    const el = document.createElement("div");
                    el.className = "bubble";
                    el.textContent = `${text} (时间: ${new Date(timestamp).toLocaleString()})`;
                    container.appendChild(el);
                });

                console.log("✅ 数据已成功加载");
            } catch (error) {
                console.error("❌ 加载失败", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            console.log("✅ 页面加载完成，绑定事件");

            const bubbleTextInput = document.getElementById("bubbleText");
            const bubbleBtn = document.getElementById("bubbleBtn");

            bubbleBtn.addEventListener("click", async () => {
                const text = bubbleTextInput.value.trim();
                if (!text) {
                    console.error("❌ 用户输入为空");
                    return;
                }
                console.log("📌 用户输入:", text);

                await saveTextToGoogleSheets(text);
                loadTextFromGoogleSheets(); // 刷新显示
            });

            loadTextFromGoogleSheets(); // 页面加载时加载数据
        });
    </script>
</body>

</html>
