<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dream</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dreamstyle.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

    <link rel="icon" href="data:,">
</head>

<body>
    <!-- 🌟 导航栏 -->
    <div class="navbar"></div>

    <!-- 📝 控件 -->
    <div id="controls">
        <input type="text" id="bubbleText" placeholder="Enter text for bubble">
        <button id="generateBubble">Generate Bubble</button>
        <button id="recStart">Start Rec</button>
        <button id="recStop" disabled>Stop Rec</button>
        <button id="testMic">Test Mic</button>
        <!-- 移除内联样式，交给 CSS 控制 -->
        <audio id="micMonitor" controls></audio>
    </div>

    <div id="voiceControls" class="voice-controls">
        <div class="vc-row">
            <label class="vc-label">Pitch (semitones):</label>
            <input id="uiPitch" type="range" min="-12" max="12" step="1" value="0" style="flex:1">
            <span id="uiPitchVal">0</span>
        </div>

        <div class="vc-row">
            <label class="vc-label">Robot</label>
            <input id="uiRobot" type="checkbox">
            <label class="vc-label">Chorus</label>
            <input id="uiChorus" type="checkbox">
            <label class="vc-label">Reverb</label>
            <input id="uiReverb" type="checkbox">
        </div>

        <div class="vc-row">
            <label class="vc-label">EQ Preset:</label>
            <select id="uiEq">
                <option value="flat">Flat</option>
                <option value="phone">Phone</option>
                <option value="warm">Warm</option>
                <option value="bright">Bright</option>
            </select>

            <label class="vc-label">Export Format:</label>
            <select id="uiFormat">
                <option value="mp3" selected>MP3 (Universal)</option>
                <option value="m4a">M4A (AAC)</option>
                <option value="ogg">OGG (Opus)</option>
                <option value="webm">WEBM (Opus)</option>
            </select>
        </div>
    </div>

    <div id="bubbleContainer"></div>

    <script defer src="./dreamscript.js"></script>
</body>

</html>
